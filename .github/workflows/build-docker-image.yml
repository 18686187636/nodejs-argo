name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'index.js'
      - 'package.json'
      - 'run.js'
      - 'agent'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: railway

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 拼出 ghcr.io/18686187636/railway，并强制小写
      - name: Set image path
        run: echo "IMAGE_PATH=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_PATH }}:latest
            ${{ env.IMAGE_PATH }}:${{ github.sha }}

      # ========== 可选：部署到目标服务器（运行时注入环境变量） ==========
      # - name: Deploy to Server (example)
      #   run: |
      #     docker pull ${{ env.IMAGE_PATH }}:latest
      #     docker stop nodejs-app || true
      #     docker rm nodejs-app || true
      #     docker run -d --name nodejs-app -p 3000:3000 \
      #       -e AGENT_URL="${{ secrets.AGENT_URL }}" \
      #       -e AGENT_TOKEN="${{ secrets.AGENT_TOKEN }}" \
      #       ${{ env.IMAGE_PATH }}:latest
